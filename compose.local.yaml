services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pgowner
      POSTGRES_USER: pgowner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - local_database:/var/lib/postgresql/data
volumes:
  local_database:
