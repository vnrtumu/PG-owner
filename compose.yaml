services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pgowner
      POSTGRES_USER: pgowner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U pgowner -d pgowner"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://pgowner:${POSTGRES_PASSWORD}@db:5432/pgowner
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      APP_ORIGIN: https://${DOMAIN:?Set DOMAIN}
      COOKIE_SECURE: "true"
      DEMO_MODE: "false"
      UPLOAD_DIR: /app/uploads
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    expose:
      - "3000"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  database:
  uploads:
  caddy_data:
  caddy_config:
